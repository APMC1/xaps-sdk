[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xaps-sdk"
version = "0.1.3"
description = "The Cognitive Circuit Breaker for Autonomous Agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{name = "APMC1", email = "support@xaps.network"}]
keywords = ["xaps", "ai-agents", "web3", "security", "autonomous-agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",

    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
]
dependencies = ["httpx>=0.27,<1", "ecdsa>=0.18,<1"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.23", "ruff>=0.4"]

[project.urls]
Homepage = "https://xaps.network"
Documentation = "https://github.com/APMC1/xaps-sdk#readme"
Repository = "https://github.com/APMC1/xaps-sdk"
"Bug Tracker" = "https://github.com/APMC1/xaps-sdk/issues"

[project.scripts]
xaps-mcp = "xaps_mcp_server:main"

[tool.setuptools]
py-modules = ["xaps_mcp_server"]

[tool.setuptools.packages.find]
where = ["."]
include = ["xaps*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"
